# Docker Compose - Nginx misconfiguracio
version: '3.8'

services:
  vulnerable-nginx:
    build:
      context: .
      dockerfile: Dockerfile.vulnerable
    container_name: vuln-nginx
    ports:
      - "9003:80"

  fixed-nginx:
    build:
      context: .
      dockerfile: Dockerfile.fixed
    container_name: fixed-nginx
    ports:
      - "9004:80"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
