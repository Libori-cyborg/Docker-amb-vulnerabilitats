# Docker Compose - Apache CVE-2021-41773
version: '3.8'

services:
  vulnerable-apache:
    build:
      context: .
      dockerfile: Dockerfile.vulnerable
    container_name: vuln-apache
    ports:
      - "9001:80"

  fixed-apache:
    build:
      context: .
      dockerfile: Dockerfile.fixed
    container_name: fixed-apache
    ports:
      - "9002:80"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
