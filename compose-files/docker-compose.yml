# Docker Compose global - Arnau Libori i Ayoub El Ballaoui
# Aixeca tots els contenidors vulnerables i corregits del projecte
version: '3.8'

services:

  # ============================================================
  # VULNERABILITATS DE XARXA
  # ============================================================

  # Apache CVE-2021-41773 - Path Traversal + RCE
  vuln-apache:
    build:
      context: ../vulnerabilities/network/apache
      dockerfile: Dockerfile.vulnerable
    container_name: vuln-apache
    ports:
      - "9001:80"

  fixed-apache:
    build:
      context: ../vulnerabilities/network/apache
      dockerfile: Dockerfile.fixed
    container_name: fixed-apache
    ports:
      - "9002:80"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # vsftpd 2.3.4 - CVE-2011-2523 Backdoor
  vuln-ftp:
    build:
      context: ../vulnerabilities/network/ftp
      dockerfile: Dockerfile.vulnerable
    container_name: vuln-ftp
    ports:
      - "2121:21"

  fixed-ftp:
    build:
      context: ../vulnerabilities/network/ftp
      dockerfile: Dockerfile.fixed
    container_name: fixed-ftp
    ports:
      - "2122:21"
      - "40000-40100:40000-40100"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # Redis sense autenticacio
  vuln-redis:
    build:
      context: ../vulnerabilities/network/redis
      dockerfile: Dockerfile.vulnerable
    container_name: vuln-redis
    ports:
      - "6380:6379"

  fixed-redis:
    build:
      context: ../vulnerabilities/network/redis
      dockerfile: Dockerfile.fixed
    container_name: fixed-redis
    ports:
      - "127.0.0.1:6381:6379"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ============================================================
  # VULNERABILITATS DE CONFIGURACIO DE SERVEIS
  # ============================================================

  # MySQL root sense contrasenya + acces remot obert
  vuln-mysql:
    build:
      context: ../vulnerabilities/configuration/mysql
      dockerfile: Dockerfile.vulnerable
    container_name: vuln-mysql
    ports:
      - "3308:3306"

  fixed-mysql:
    build:
      context: ../vulnerabilities/configuration/mysql
      dockerfile: Dockerfile.fixed
    container_name: fixed-mysql
    ports:
      - "127.0.0.1:3309:3306"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Nginx directory listing + fitxers sensibles exposats
  vuln-nginx:
    build:
      context: ../vulnerabilities/configuration/nginx
      dockerfile: Dockerfile.vulnerable
    container_name: vuln-nginx
    ports:
      - "9003:80"

  fixed-nginx:
    build:
      context: ../vulnerabilities/configuration/nginx
      dockerfile: Dockerfile.fixed
    container_name: fixed-nginx
    ports:
      - "9004:80"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # SSH PermitRootLogin + contrasenya feble
  vuln-ssh:
    build:
      context: ../vulnerabilities/configuration/ssh
      dockerfile: Dockerfile.vulnerable
    container_name: vuln-ssh
    ports:
      - "2223:22"

  fixed-ssh:
    build:
      context: ../vulnerabilities/configuration/ssh
      dockerfile: Dockerfile.fixed
    container_name: fixed-ssh
    ports:
      - "2224:22"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # ============================================================
  # VULNERABILITATS DE CONTENIDOR/HOST
  # ============================================================

  # Sense limits de recursos
  vuln-no-resource-limits:
    build:
      context: ../vulnerabilities/container-host/no-resource-limits
      dockerfile: Dockerfile.vulnerable
    container_name: vuln-no-resource-limits
    ports:
      - "8089:8080"

  fixed-no-resource-limits:
    build:
      context: ../vulnerabilities/container-host/no-resource-limits
      dockerfile: Dockerfile.fixed
    container_name: fixed-no-resource-limits
    ports:
      - "8090:8080"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Capabilities innecessaries
  vuln-unnecessary-capabilities:
    build:
      context: ../vulnerabilities/container-host/unnecessary-capabilities
      dockerfile: Dockerfile.vulnerable
    container_name: vuln-unnecessary-capabilities
    ports:
      - "8091:8080"

  fixed-unnecessary-capabilities:
    build:
      context: ../vulnerabilities/container-host/unnecessary-capabilities
      dockerfile: Dockerfile.fixed
    container_name: fixed-unnecessary-capabilities
    ports:
      - "8092:8080"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # Muntatges perillosos
  vuln-dangerous-mounts:
    build:
      context: ../vulnerabilities/container-host/dangerous-mounts
      dockerfile: Dockerfile.vulnerable
    container_name: vuln-dangerous-mounts
    ports:
      - "8093:8080"
    volumes:
      - /:/host
      - /var/run/docker.sock:/var/run/docker.sock

  fixed-dangerous-mounts:
    build:
      context: ../vulnerabilities/container-host/dangerous-mounts
      dockerfile: Dockerfile.fixed
    container_name: fixed-dangerous-mounts
    ports:
      - "8094:8080"
    volumes:
      - ./data:/app/data:ro
